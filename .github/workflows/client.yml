name: Build and Push Client Image

on:
  push:
    branches: ["main"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate client build variables
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          API_INTERNAL_BASE_URL: ${{ secrets.API_INTERNAL_BASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          set -euo pipefail
          node -e "for (const name of ['NEXTAUTH_URL','NEXT_PUBLIC_SITE_URL','NEXT_PUBLIC_API_BASE_URL','API_INTERNAL_BASE_URL']) { const value = process.env[name]; if (!value) throw new Error(name + ' is required'); try { new URL(value); } catch { throw new Error(name + ' must be a valid URL'); } } for (const name of ['NEXTAUTH_SECRET','AUTH_SECRET']) { if (!process.env[name]) throw new Error(name + ' is required'); }"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/event-ticketing-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/event-ticketing-client:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Multi-Tenant Event Intelligence Platform' }}
            NEXT_PUBLIC_APP_DESCRIPTION=${{ vars.NEXT_PUBLIC_APP_DESCRIPTION || 'Multi-tenant event intelligence platform' }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            API_INTERNAL_BASE_URL=${{ secrets.API_INTERNAL_BASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
