name: Build and Push Recommendation Image

on:
  push:
    branches: ["main"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push recommendation image
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation-service
          file: ./recommendation-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/event-ticketing-recommendations:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/event-ticketing-recommendations:${{ github.sha }}
          platforms: linux/amd64
