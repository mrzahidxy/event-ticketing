services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_USERNAME}/event-ticketing-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: event-intelligence-backend
      KAFKA_TOPIC_DOMAIN_EVENTS: domain-events
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"

  recommendation-service:
    image: ${DOCKERHUB_USERNAME}/event-ticketing-recommendations:latest
    restart: unless-stopped

  analytics-worker:
    image: ${DOCKERHUB_USERNAME}/event-ticketing-api:latest
    command: ["npm", "run", "worker:analytics:compiled"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_NAME: analytics-worker
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: event-intelligence-backend
      KAFKA_TOPIC_DOMAIN_EVENTS: domain-events
      KAFKA_ANALYTICS_GROUP_ID: analytics-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    image: ${DOCKERHUB_USERNAME}/event-ticketing-client:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
